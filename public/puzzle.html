<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневная тренировка — ChessRad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/puzzle.css">
</head>
<body>
    <div class="puzzle-page page-wrap">
        <div class="puzzle-container glass-strong">
            <div class="puzzle-board-wrap">
                <div id="board"></div>
            </div>

            <div class="puzzle-panel">
                <div class="puzzle-streak" id="streak-info">🔥 Загрузка...</div>
                <div class="puzzle-timer" id="timer">01:00</div>
                <div class="puzzle-progress">
                    <div id="progress-fill"></div>
                </div>
                <div id="status" class="puzzle-status">Готовы к тренировке?</div>
                <div class="puzzle-actions">
                    <button class="btn btn-primary btn-block" id="action-btn">Начать тренировку</button>
                    <button class="btn btn-secondary btn-block" onclick="location.href='/lobby'">В лобби</button>
                </div>
                <div id="description" class="puzzle-description">
                    Решите 10 задач подряд. Каждая верная задача продвигает вас по уровню и сохраняет стрик.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/puzzle.js"></script>
</body>
</html>
