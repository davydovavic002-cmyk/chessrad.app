<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турнир — ChessRad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/tournament.css">
</head>
<body>
    <div class="tournament-page page-wrap">
        <aside class="tournament-sidebar glass">
            <h1>Шахматный турнир</h1>
            <div id="user-status" class="user-profile-box"></div>
            <div class="status-card">
                <p>Статус: <span id="tournamentstatus">Загрузка...</span></p>
                <p>Раунд: <span id="roundnumber">0</span></p>
            </div>
            <div class="actions">
                <button id="registerBtn" class="btn btn-primary">Зарегистрироваться</button>
            </div>
            <div class="participants-section">
                <h3>Участники <span id="playercount">(0)</span></h3>
                <ul id="playerlist"></ul>
            </div>
            <div class="sidebar-footer">
                <a href="/lobby" class="back-link">← В лобби</a>
            </div>
        </aside>

        <main class="tournament-main">
            <section class="section-box">
                <h2>Пары текущего раунда</h2>
                <div class="table-wrapper">
                    <table id="pairingstable" class="table-glass">
                        <thead>
                            <tr>
                                <th>⚪ Белые</th>
                                <th>⚫ Черные</th>
                                <th>Результат</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="section-box">
                <h2>Турнирная таблица</h2>
                <div class="table-wrapper">
                    <table id="standingstable" class="table-glass">
                        <thead>
                            <tr>
                                <th class="col-rank">#</th>
                                <th>Участник</th>
                                <th class="col-stat">Очки</th>
                                <th class="col-stat">Победы</th>
                                <th class="col-stat">Ничьи</th>
                                <th class="col-stat">Поражения</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/tournament.js"></script>
</body>
</html>
