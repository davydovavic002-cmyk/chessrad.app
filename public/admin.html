<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — ChessRad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-page page-wrap">
        <div class="admin-container glass-strong">
            <header>
                <h1>Управление ChessRad</h1>
                <a href="/lobby" class="back-link">← В лобби</a>
            </header>

            <div class="admin-controls">
                <label for="sort-mode"><strong>Сортировка:</strong></label>
                <select id="sort-mode" class="form-input" style="width:auto;min-width:180px;" onchange="loadUsers()">
                    <option value="new">Сначала новые</option>
                    <option value="old">Сначала старые</option>
                    <option value="rating">По рейтингу</option>
                    <option value="alphabet">По алфавиту</option>
                </select>
            </div>

            <div class="admin-table-wrap">
                <table class="table-glass">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Пользователь</th>
                            <th>Роль</th>
                            <th>Рейтинг</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <tr><td colspan="5" class="text-center">Загрузка данных...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
