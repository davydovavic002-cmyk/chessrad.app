<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турнирная игра — ChessRad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/game.css">
    <link rel="stylesheet" href="/css/tournament-game.css">
</head>
<body>
    <div class="tournament-game-page page-wrap">
        <div class="tournament-game-layout game-layout">
            <div class="game-area">
                <div id="opponent-info" class="player-panel">
                    <span class="player-name" id="opponent-name">Соперник</span>
                    <div id="opponent-timer" class="timer">05:00</div>
                </div>
                <div class="board-wrap">
                    <div id="myBoard"></div>
                </div>
                <div id="me-info" class="player-panel">
                    <span class="player-name" id="me-name">Вы</span>
                    <div id="me-timer" class="timer">05:00</div>
                </div>
                <div id="turn-info" class="waiting-turn">Ожидание начала...</div>
            </div>

            <aside class="game-sidebar">
                <div class="panel glass-card">
                    <h3>Статус</h3>
                    <p id="status">Подключение...</p>
                </div>
                <div class="panel glass-card">
                    <div class="game-controls">
                        <button id="resign-btn" class="btn btn-danger">Сдаться</button>
                        <button id="return-to-tournament-btn" class="btn btn-secondary">В лобби турнира</button>
                    </div>
                </div>
                <div class="panel glass-card debug-box">
                    <h3>История (PGN)</h3>
                    <pre id="pgn">-</pre>
                    <p>FEN: <span id="fen">-</span></p>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/tournament-game.js"></script>
</body>
</html>
