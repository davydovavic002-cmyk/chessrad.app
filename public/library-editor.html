<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор библиотеки — ChessRad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/library-editor.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        #fen-display { background:rgba(45,31,26,0.08); padding:10px; margin-top:10px; border-radius:var(--radius-sm); font-family:monospace; font-size:11px; word-break:break-all; }
        .btn-save-main { background:linear-gradient(135deg,var(--emerald),var(--mint)); color:white; border:none; padding:14px; border-radius:var(--radius-md); width:100%; font-weight:700; cursor:pointer; font-family:var(--font-body); }
        .btn-edit-small { border:none; background:rgba(255,255,255,0.3); cursor:pointer; color:var(--peach-600); padding:8px; border-radius:var(--radius-sm); }
        .back-btn { margin-bottom:20px; cursor:pointer; color:var(--peach-600); font-weight:700; display:flex; align-items:center; gap:8px; }
        #editModal { display:none; position:fixed; inset:0; background:rgba(45,31,26,0.45); backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; }
        #editModal .modal-content { padding:28px; border-radius:var(--radius-xl); width:400px; max-width:90vw; }
    </style>
</head>
<body>
<div class="library-page page-wrap">
    <a href="/profile.html" class="back-link mb-2">← К профилю</a>
    <h1>Редактор библиотеки</h1>
<div class="editor-container">
    <div class="board-section">
        <h3 style="margin-top:0">Конструктор</h3>
        <div id="board" style="width: 100%;"></div>
        <div id="fen-display">FEN: start</div>
        <div style="margin-top:15px;display:flex;gap:10px;">
            <button onclick="board.start()" class="btn btn-secondary" style="flex:1;">Начальная</button>
            <button onclick="board.clear()" class="btn btn-secondary" style="flex:1;">Очистить</button>
        </div>
        <button class="btn-save-main" style="margin-top: 15px;" onclick="openSaveModal()">
            <i class="fas fa-plus"></i> Сохранить позицию
        </button>
    </div>

    <div class="form-section">
        <div id="library-view">
            <h2 style="margin-top:0; font-size: 24px;">Библиотека разделов</h2>
            <div id="big-folders-root"></div>
        </div>

        <div id="folder-detail-view" class="hidden">
            <div class="back-btn" onclick="showRoot()"><i class="fas fa-arrow-left"></i> Назад</div>
            <h3 id="current-folder-title" style="margin-top:0; color: var(--primary-blue);">Папка</h3>
            <div id="positions-sortable" class="positions-sortable-list"></div>
        </div>
    </div>
</div>

<div id="editModal" class="modal-overlay">
    <div class="modal-glass" style="text-align:left;">
        <h3 id="modal-title" style="margin-top:0">Сохранение</h3>
        <input type="hidden" id="edit-pos-id">

        <div class="form-group">
            <label>Название позиции</label>
            <input type="text" id="pos-title" class="form-input" placeholder="Например: Мат в 1 ход">
        </div>
        <div class="form-group">
            <label>Раздел (Надпапка)</label>
            <input type="text" id="pos-big-folder" class="form-input" list="big-folder-list" placeholder="Например: Эндшпиль">
            <datalist id="big-folder-list"></datalist>
        </div>
        <div class="form-group">
            <label>Папка (Тема)</label>
            <input type="text" id="pos-category" class="form-input" list="category-list" placeholder="Например: Вилки">
            <datalist id="category-list"></datalist>
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <button class="btn-save-main" onclick="savePositionData()">Записать</button>
            <button onclick="closeModal()" class="btn btn-secondary" style="flex:1;">Отмена</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    let board = Chessboard('board', {
        draggable: true, dropOffBoard: 'trash', sparePieces: true, position: 'start',
        onChange: (oldP, newP) => {
            document.getElementById('fen-display').innerText = 'FEN: ' + Chessboard.objToFen(newP) + ' w - - 0 1';
        }
    });

    let allPositions = [];

    async function loadLibrary() {
        const res = await fetch('/api/positions');
        allPositions = await res.json();
        updateDatalists();
        renderBigFolders();
    }

    function updateDatalists() {
        const bigs = [...new Set(allPositions.map(p => p.big_folder || 'Без раздела'))];
        const cats = [...new Set(allPositions.map(p => p.category || 'Общее'))];
        document.getElementById('big-folder-list').innerHTML = bigs.map(b => `<option value="${b}">`).join('');
        document.getElementById('category-list').innerHTML = cats.map(c => `<option value="${c}">`).join('');
    }

    function renderBigFolders() {
        const root = document.getElementById('big-folders-root');
        root.innerHTML = '';
        const bigs = [...new Set(allPositions.map(p => p.big_folder || 'Без раздела'))].sort();

        bigs.forEach(bigName => {
            const section = document.createElement('div');
            section.className = 'big-folder-container';
            const subPositions = allPositions.filter(p => (p.big_folder || 'Без раздела') === bigName);
            const subFolders = [...new Set(subPositions.map(p => p.category || 'Общее'))].sort();

            section.innerHTML = `
                <div class="big-folder-header" onclick="$(this).next().slideToggle(150)">
                    <i class="fas fa-layer-group"></i> ${bigName}
                </div>
                <div class="big-folder-content">
                    ${subFolders.map(sub => `
                        <div class="folder-card" onclick="openFolder('${bigName}', '${sub}')">
                            <div>📂</div>
                            <strong>${sub}</strong>
                            <div class="count">${subPositions.filter(p => p.category === sub).length} поз.</div>
                        </div>
                    `).join('')}
                </div>
            `;
            root.appendChild(section);
        });
    }

    function openFolder(big, sub) {
        document.getElementById('library-view').classList.add('hidden');
        document.getElementById('folder-detail-view').classList.remove('hidden');
        document.getElementById('current-folder-title').innerText = `${big} / ${sub}`;

        const list = document.getElementById('positions-sortable');
        list.innerHTML = '';
        const folderItems = allPositions
            .filter(p => (p.big_folder || 'Без раздела') === big && (p.category || 'Общее') === sub)
            .sort((a, b) => (a.order_index || 0) - (b.order_index || 0));

        folderItems.forEach(pos => {
            const item = document.createElement('div');
            item.className = 'pos-sort-item';
            item.dataset.id = pos.id;
            item.innerHTML = `
                <div class="drag-handle" style="cursor:grab; padding:10px; color:#ccc"><i class="fas fa-grip-lines"></i></div>
                <div id="mini-${pos.id}" class="pos-mini-preview"></div>
                <div class="pos-details"><strong>${pos.title}</strong></div>
                <div style="display:flex; gap:5px">
                    <button onclick="editPos(${pos.id})" class="btn-edit-small"><i class="fas fa-edit"></i></button>
                    <button onclick="deletePos(${pos.id})" class="btn-edit-small" style="color:#e74c3c"><i class="fas fa-trash"></i></button>
                </div>
            `;
            list.appendChild(item);
            setTimeout(() => Chessboard(`mini-${pos.id}`, { position: pos.fen, draggable: false }), 50);
        });

        new Sortable(list, {
            handle: '.drag-handle',
            animation: 150,
            onEnd: async () => {
                const order = Array.from(list.children).map((el, idx) => ({ id: el.dataset.id, order_index: idx }));
                await fetch('/api/positions/reorder', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ positions: order })
                });
            }
        });
    }

    function openSaveModal() {
        document.getElementById('modal-title').innerText = "Новая позиция";
        document.getElementById('edit-pos-id').value = '';
        document.getElementById('editModal').style.display = 'flex';
    }

    function editPos(id) {
        const pos = allPositions.find(p => p.id == id);
        document.getElementById('edit-pos-id').value = pos.id;
        document.getElementById('pos-title').value = pos.title;
        document.getElementById('pos-big-folder').value = pos.big_folder || '';
        document.getElementById('pos-category').value = pos.category || '';
        document.getElementById('editModal').style.display = 'flex';
        board.position(pos.fen);
    }

    async function savePositionData() {
        const id = document.getElementById('edit-pos-id').value;
        const title = document.getElementById('pos-title').value.trim();
        const big_folder = document.getElementById('pos-big-folder').value.trim() || 'Без раздела';
        const category = document.getElementById('pos-category').value.trim() || 'Общее';
        const fen = document.getElementById('fen-display').innerText.replace('FEN: ', '');

        if (!title) return alert('Название обязательно');

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/positions/${id}` : '/api/positions';

        await fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title, big_folder, category, fen })
        });

        closeModal();
        loadLibrary();
        showRoot();
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        document.getElementById('pos-title').value = '';
    }

    function showRoot() {
        document.getElementById('library-view').classList.remove('hidden');
        document.getElementById('folder-detail-view').classList.add('hidden');
        loadLibrary();
    }

    async function deletePos(id) {
        if(confirm('Удалить позицию?')) {
            await fetch(`/api/positions/${id}`, { method: 'DELETE' });
            loadLibrary();
            showRoot();
        }
    }

    loadLibrary();
</script>
</div>
</body>
</html>
