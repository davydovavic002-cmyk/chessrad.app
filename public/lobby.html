<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лобби — ChessRad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="lobby-container page-wrap">
        <header class="lobby-header">
            <div class="logo-area">
                <h1>ChessRad</h1>
                <span class="badge badge-online">Online</span>
            </div>
            <div id="user-status" class="user-info"></div>
        </header>

        <main class="lobby-content">
            <h2>Добро пожаловать в студию</h2>
            <p class="subtitle">Выберите режим игры или проверьте свои достижения</p>

            <div class="menu-grid">
                <div class="menu-card primary glass-card" id="find-game-btn">
                    <div class="card-icon">⚔️</div>
                    <div class="card-text">
                        <h3>Найти игру</h3>
                        <p>Быстрый матч 1×1</p>
                    </div>
                </div>

                <div class="menu-card glass-card" id="profile-btn">
                    <div class="card-icon">👤</div>
                    <div class="card-text">
                        <h3>Мой профиль</h3>
                        <p>Статистика и рейтинг</p>
                    </div>
                </div>

                <div class="menu-card glass-card" id="tournaments-btn">
                    <div class="card-icon">🏆</div>
                    <div class="card-text">
                        <h3>Турниры</h3>
                        <p>Битва за звание чемпиона</p>
                    </div>
                </div>

                <div id="admin-card-container"></div>
            </div>

            <div class="lobby-section study-section">
                <h2>Обучение</h2>
                <div id="study-controls">
                    <div class="menu-card glass-card study-card">
                        <div class="card-text"><h3>Загрузка...</h3></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/lobby.js"></script>
</body>
</html>
