<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessRad — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-brand">
                <h1>ChessRad</h1>
                <p>Шахматная студия для обучения и роста</p>
            </div>

            <div class="auth-card glass-strong">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Вход</button>
                    <button class="auth-tab" data-tab="register">Регистрация</button>
                </div>

                <form id="login-form" class="auth-form active">
                    <div class="form-group">
                        <label for="login-username">Имя пользователя</label>
                        <input type="text" id="login-username" class="form-input" placeholder="Введите логин" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Пароль</label>
                        <input type="password" id="login-password" class="form-input" placeholder="Введите пароль" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Войти в студию</button>
                    <div id="login-error" class="auth-error"></div>
                </form>

                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label for="reg-username">Имя пользователя</label>
                        <input type="text" id="reg-username" class="form-input" placeholder="Придумайте логин" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Пароль</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="Минимум 4 символа" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Роль</label>
                        <div class="role-select">
                            <div class="role-option selected" data-role="student">
                                <span class="role-icon">🎓</span>
                                Ученик
                            </div>
                            <div class="role-option" data-role="teacher">
                                <span class="role-icon">📚</span>
                                Учитель
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
                    <div id="register-msg" class="auth-error"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
