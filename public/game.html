<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра — ChessRad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/game.css">
</head>
<body>
    <div class="game-page page-wrap">
        <div class="game-layout">
            <div class="game-area">
                <div id="player-streak" class="streak-fire">🔥 Серия побед: <span id="streak-count">0</span></div>
                <div id="turn-info">Ожидание начала игры...</div>
                <div class="board-wrap">
                    <div id="myBoard"></div>
                </div>
            </div>

            <aside class="game-sidebar">
                <div class="panel glass-card">
                    <h3>Статус</h3>
                    <p id="status">Подключение к серверу...</p>
                </div>

                <div class="panel glass-card">
                    <div class="game-controls">
                        <button id="find-game-btn" class="btn btn-primary">Найти игру</button>
                        <div id="game-controls" style="display:none;">
                            <button id="resign-btn" class="btn btn-danger">Сдаться</button>
                            <button id="rematch-btn" class="btn btn-secondary" style="display:none;">Реванш</button>
                        </div>
                        <a href="/lobby" class="button-link">← Вернуться в лобби</a>
                    </div>
                </div>

                <div class="panel glass-card debug-box">
                    <h3>Отладка</h3>
                    <p>FEN: <code id="fen">-</code></p>
                    <p>PGN:</p>
                    <pre id="pgn">-</pre>
                </div>
            </aside>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/game.js"></script>
</body>
</html>
