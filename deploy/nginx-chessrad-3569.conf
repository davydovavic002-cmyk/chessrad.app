# Новая версия ChessRad на https://chessrad.app:3569
# Старая версия остаётся на https://chessrad.app (порт 443)
#
# Node слушает внутренний порт 13569 (см. .env PORT=13569).
# nginx занимает публичный 3569 (SSL) и проксирует на Node.
#
# Установка:
#   sudo cp deploy/nginx-chessrad-3569.conf /etc/nginx/sites-available/chessrad-3569
#   sudo ln -sf /etc/nginx/sites-available/chessrad-3569 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 3569/tcp

server {
    listen 3569 ssl http2;
    server_name chessrad.app;

    ssl_certificate     /etc/letsencrypt/live/chessrad.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chessrad.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:13569;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
