# Новая версия ChessRad на https://new.chessrad.app (порт 443)
# Старая версия остаётся на https://chessrad.app
#
# DNS: new.chessrad.app → IP сервера
# .env: PORT=13569, PUBLIC_ORIGIN=https://new.chessrad.app
#
# Сертификат должен включать new.chessrad.app (расширить существующий):
#   sudo apt install -y python3-certbot-nginx
#   sudo certbot certonly --nginx -d chessrad.app -d new.chessrad.app
#
# Установка:
#   sudo cp deploy/nginx-chessrad-new.conf /etc/nginx/sites-available/chessrad-new
#   sudo ln -sf /etc/nginx/sites-available/chessrad-new /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name new.chessrad.app;

    ssl_certificate     /etc/letsencrypt/live/chessrad.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chessrad.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:13569;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
